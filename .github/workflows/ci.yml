name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/check-security
      - run: uv run ruff check .
      - run: node --check src/tfr/web/app.mjs
      - run: node --test tests/test_web_*.mjs
      - run: npm --prefix tests/e2e ci
      - run: npm --prefix tests/e2e exec -- playwright install --with-deps webkit
      - run: npm --prefix tests/e2e test
      - run: >-
          uv run pytest -q
          -k 'not test_two_worlds_exchange_traffic_without_leakage'
      - run: uv build
      - name: Verify packaged web modules
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          assets="$(unzip -Z1 "${wheels[0]}")"
          grep -Fxq 'tfr/web/app.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/command.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/connection-lifecycle.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/event-details.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/history-notice.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/linkify.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/motion.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/pairing.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/presentation.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/swipe.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/text-runs.mjs' <<<"$assets"
