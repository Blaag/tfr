name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: node --check src/tfr/web/app.mjs
      - run: node --test tests/test_web_pairing.mjs
      - run: >-
          uv run pytest -q
          -k 'not test_two_worlds_exchange_traffic_without_leakage'
      - run: uv build
      - name: Verify packaged web modules
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          assets="$(unzip -Z1 "${wheels[0]}")"
          grep -Fxq 'tfr/web/app.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/pairing.mjs' <<<"$assets"
