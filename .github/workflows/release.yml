name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: >-
          uv run pytest -q
          -k 'not test_two_worlds_exchange_traffic_without_leakage'
      - name: Embed immutable build identity
        run: printf 'BUILD_COMMIT = "%s"\n' "$GITHUB_SHA" > src/tfr/_build.py
      - run: uv build
      - name: Build update manifest
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run python scripts/build_update_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --artifact "${wheels[0]}"
      - name: Transfer release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*
            update-manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: stable-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Verify tag still identifies this workflow commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          object_type="$(jq -r .object.type <<<"$object")"
          tag_sha="$(jq -r .object.sha <<<"$object")"
          if test "$object_type" = tag; then
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            object_type="$(jq -r .object.type <<<"$object")"
            tag_sha="$(jq -r .object.sha <<<"$object")"
          fi
          test "$object_type" = commit
          test "$tag_sha" = "$GITHUB_SHA"
      - name: Verify release commit remains on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" \
            --jq .status)"
          test "$status" = ahead || test "$status" = identical
      - name: Verify stable version is newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_refs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref')"
          STABLE_REFS="$stable_refs" python3 - <<'PY'
          import os
          import re

          pattern = re.compile(
              r"refs/tags/v(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          )
          candidate = tuple(int(part) for part in os.environ["GITHUB_REF_NAME"][1:].split("."))
          versions = [
              tuple(int(part) for part in match.groups())
              for ref in os.environ["STABLE_REFS"].splitlines()
              if (match := pattern.fullmatch(ref)) is not None
          ]
          if not versions or candidate != max(versions):
              raise SystemExit("release version is not the newest stable tag")
          PY
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/dist/* release-assets/update-manifest.json
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
