name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-candidate.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Identify release channel
        id: release
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'channel=stable' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-candidate\.[1-9][0-9]*$ ]]; then
            echo 'channel=candidate' >> "$GITHUB_OUTPUT"
          else
            echo 'unsupported release tag' >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: ./scripts/check-security
      - run: uv run ruff check .
      - run: node --check src/tfr/web/app.mjs
      - run: node --test tests/test_web_*.mjs
      - run: npm --prefix tests/e2e ci
      - run: npm --prefix tests/e2e exec -- playwright install --with-deps webkit
      - run: npm --prefix tests/e2e test
      - run: >-
          uv run pytest -q
          -k 'not test_two_worlds_exchange_traffic_without_leakage'
      - name: Embed immutable build identity
        run: printf 'BUILD_COMMIT = "%s"\n' "$GITHUB_SHA" > src/tfr/_build.py
      - name: Build candidate artifacts
        if: steps.release.outputs.channel == 'candidate'
        run: uv build
      - name: Download exact candidate artifacts for stable promotion
        if: steps.release.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          promoted=
          while IFS= read -r candidate; do
            case "$candidate" in
              "v$version-candidate."*) ;;
              *) continue ;;
            esac
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$candidate")"
            object_type="$(jq -r .object.type <<<"$object")"
            object_sha="$(jq -r .object.sha <<<"$object")"
            if test "$object_type" = tag; then
              object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")"
              object_type="$(jq -r .object.type <<<"$object")"
              object_sha="$(jq -r .object.sha <<<"$object")"
            fi
            if test "$object_type" = commit && test "$object_sha" = "$GITHUB_SHA"; then
              mkdir -p dist
              gh release download "$candidate" --repo "$GITHUB_REPOSITORY" \
                --pattern '*.whl' --pattern '*.tar.gz' --dir dist
              promoted="$candidate"
              break
            fi
          done <<EOF
          $(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')
          EOF
          test -n "$promoted" || {
            echo 'no immutable candidate release exists for this exact commit' >&2
            exit 1
          }
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          echo "Promoting exact artifacts from $promoted"
      - name: Verify packaged web modules
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          assets="$(unzip -Z1 "${wheels[0]}")"
          grep -Fxq 'tfr/web/app.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/command.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/connection-lifecycle.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/event-details.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/history-notice.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/linkify.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/motion.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/pairing.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/presentation.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/swipe.mjs' <<<"$assets"
          grep -Fxq 'tfr/web/text-runs.mjs' <<<"$assets"
      - name: Build update manifest
        run: |
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run python scripts/build_update_manifest.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --artifact "${wheels[0]}" \
            --channel "${{ steps.release.outputs.channel }}"
      - name: Transfer release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*
            update-manifest.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: ${{ needs.build.outputs.channel }}-release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Verify tag still identifies this workflow commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          object_type="$(jq -r .object.type <<<"$object")"
          tag_sha="$(jq -r .object.sha <<<"$object")"
          if test "$object_type" = tag; then
            object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha")"
            object_type="$(jq -r .object.type <<<"$object")"
            tag_sha="$(jq -r .object.sha <<<"$object")"
          fi
          test "$object_type" = commit
          test "$tag_sha" = "$GITHUB_SHA"
      - name: Verify release commit remains on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" \
            --jq .status)"
          test "$status" = ahead || test "$status" = identical
      - name: Verify stable version is newest
        if: needs.build.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stable_refs="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref')"
          STABLE_REFS="$stable_refs" python3 - <<'PY'
          import os
          import re

          pattern = re.compile(
              r"refs/tags/v(0|[1-9][0-9]*)\."
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)"
          )
          candidate = tuple(int(part) for part in os.environ["GITHUB_REF_NAME"][1:].split("."))
          versions = [
              tuple(int(part) for part in match.groups())
              for ref in os.environ["STABLE_REFS"].splitlines()
              if (match := pattern.fullmatch(ref)) is not None
          ]
          if not versions or candidate != max(versions):
              raise SystemExit("release version is not the newest stable tag")
          PY
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          arguments=
          if test "${{ needs.build.outputs.channel }}" = candidate; then
            arguments='--prerelease'
          fi
          gh release create "$GITHUB_REF_NAME" \
            release-assets/dist/* release-assets/update-manifest.json \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $arguments
