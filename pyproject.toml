[project]
name = "tfr"
version = "0.1.96"
description = "A multi-world terminal client with auditable human and LLM sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "json-with-comments>=1.3.0",
    "openai>=3.42.1",
    "pillow>=13.0.0,<14",
    "plotext>=6.1.0,<7",
    "prompt-toolkit>=3.0.53",
    "qrcode>=8.2",
    "pydantic>=2.14.2",
    "regex>=2026.9.29",
    "retroflow>=0.10.0,<0.11",
    "symspellpy>=6.10.1,<7",
]

[project.scripts]
tfr = "tfr:main"

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "uv_build==0.13.6",
]
dev = [
    "bandit==1.9.4",
    "filelock>=4.2.6",
    "pip-audit==2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "trustme>=1.2.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
