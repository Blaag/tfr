[project]
name = "tfr"
version = "0.1.0"
description = "A multi-world terminal client with auditable human and LLM sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "json-with-comments>=1.3.0",
    "openai>=3.9.0",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
]

[project.scripts]
tfr = "tfr:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "trustme>=1.2.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
