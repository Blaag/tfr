[project]
name = "tfr"
version = "0.1.4"
description = "A multi-world terminal client with auditable human and LLM sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "json-with-comments>=1.3.0",
    "openai>=3.14.1",
    "plotext>=6.1.0,<7",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "retroflow>=0.10.0,<0.11",
]

[project.scripts]
tfr = "tfr:main"

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "uv_build==0.12.15",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "trustme>=1.2.1",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
